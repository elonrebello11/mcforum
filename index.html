<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Network - Main Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <button id="sidebarToggle" class="icon-btn"><i class="fa-solid fa-bars"></i></button>
            <h2>MC Network Hub</h2>
        </div>
        <div class="nav-right">
            <span id="userDisplay" style="display: none;"></span>
            <button id="loginBtn" class="primary-btn"><i class="fa-brands fa-google"></i> Sign In</button>
            <button id="logoutBtn" class="secondary-btn" style="display: none;">Sign Out</button>
        </div>
    </header>

    <div class="app-container">
        <!-- Collapsible Sidebar Menu -->
        <aside id="sidebar" class="sidebar">
            <ul class="nav-links">
                <li class="nav-item active" data-target="roomsView"><i class="fa-solid fa-comments"></i> Chat Rooms</li>
                <li class="nav-item" data-target="privateView"><i class="fa-solid fa-lock"></i> Private Rooms</li>
                <li class="nav-item" data-target="friendsView"><i class="fa-solid fa-user-group"></i> Friends</li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- View 1: Public Chat Rooms -->
            <section id="roomsView" class="view-section active">
                <div class="rooms-header">
                    <h3>Public Chat Rooms</h3>
                    <div class="room-chips">
                        <button class="room-chip active" data-room="global"># global-chat</button>
                        <button class="room-chip" data-room="survival"># survival</button>
                        <button class="room-chip" data-room="trading"># market-trading</button>
                        <button class="room-chip" data-room="builds"># showcase</button>
                    </div>
                </div>
                <div class="chat-wrapper">
                    <div id="messageContainer" class="message-container"></div>
                    <form id="chatForm" class="chat-form">
                        <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
                        <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>
            </section>

            <!-- View 2: Private Rooms (Close Friends) -->
            <section id="privateView" class="view-section">
                <h3>Close Friends Private Rooms</h3>
                <div class="create-room-box">
                    <input type="text" id="privateRoomName" placeholder="Enter private room name...">
                    <button id="createPrivateRoomBtn" class="primary-btn">Create Room</button>
                </div>
                <div id="privateRoomsList" class="rooms-grid"></div>
            </section>

            <!-- View 3: Friends Tab -->
            <section id="friendsView" class="view-section">
                <h3>Your Friends</h3>
                <div class="add-friend-box">
                    <input type="text" id="friendEmailInput" placeholder="Enter friend's email/username...">
                    <button id="addFriendBtn" class="primary-btn">Add Friend</button>
                </div>
                <div id="friendsList" class="friends-list"></div>
            </section>

        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
